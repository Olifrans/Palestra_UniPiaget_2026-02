<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0B132B; color: #F8FAFC; font-family: 'Inter', sans-serif; overflow: hidden; }
    .slide-container {
      width: 1280px; min-height: 720px; background: #0B132B;
      display: flex; flex-direction: column; padding: 60px; justify-content: center;
    }
    .motif { border-left: 4px solid #00E5FF; padding-left: 30px; }
    h2 { font-size: 32px; font-weight: 400; color: #94A3B8; margin-bottom: 20px; }
    .big-text { font-size: 64px; font-weight: 700; line-height: 1.1; max-width: 1000px; }
    .big-text span { color: #00E5FF; }
    .footer { margin-top: 80px; font-size: 14px; color: #94A3B8; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif">
      <h2>A tecnologia está transformando o mundo</h2>
      <div class="big-text">
        A transformação digital não é sobre <span> ferramentas</span>, é sobre como <span>reimaginamos</span> empresas, profissões e a própria sociedade.
      </div>
    </div>
    <p class="footer">EDUCAUSE Review | Emerging Technologies and Trends (2026)</p>
  </div>
</body>
</html>
