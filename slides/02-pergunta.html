<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0B132B; color: #F8FAFC; font-family: 'Inter', sans-serif; overflow: hidden; }
    .slide-container {
      width: 1280px; min-height: 720px; background: #0B132B;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px;
    }
    .motif { width: 4px; height: 100px; background: #00E5FF; margin-bottom: 40px; }
    h2 { font-size: 48px; font-weight: 700; text-align: center; max-width: 900px; line-height: 1.2; }
    .context { font-size: 20px; color: #94A3B8; margin-top: 40px; max-width: 700px; text-align: center; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif"></div>
    <h2>"O que realmente prepara um profissional para o futuro?"</h2>
    <p class="context">Uma reflexão sobre a distância entre o diploma, a experiência prática e a capacidade de adaptação em um mundo em constante mudança.</p>
  </div>
</body>
</html>
