<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0B132B; color: #F8FAFC; font-family: 'Inter', sans-serif; overflow: hidden; }
    .slide-container {
      width: 1280px; min-height: 720px; background: #0B132B;
      display: flex; flex-direction: column; padding: 60px;
    }
    header { border-left: 4px solid #00E5FF; padding-left: 20px; margin-bottom: 60px; }
    h2 { font-size: 32px; font-weight: 700; }
    .diagram { flex: 1; display: flex; align-items: center; justify-content: center; gap: 40px; }
    .node {
      width: 280px; height: 200px; background: #1C2541; border: 1px solid #334155;
      border-radius: 12px; padding: 25px; display: flex; flex-direction: column;
      align-items: center; text-align: center; gap: 15px; position: relative;
    }
    .node i { font-size: 36px; color: #00E5FF; }
    .node h3 { font-size: 20px; font-weight: 700; }
    .node p { font-size: 14px; color: #94A3B8; }
    .arrow { color: #3B82F6; font-size: 24px; }
    .highlight { border: 2px solid #00E5FF; box-shadow: 0 0 20px #00E5FF33; }
  </style>
</head>
<body>
  <div class="slide-container">
    <header>
      <h2>Educação, tecnologia e mercado</h2>
    </header>
    <div class="diagram">
      <div class="node">
        <i class="fas fa-graduation-cap"></i>
        <h3>Capacitação</h3>
        <p>Instrutor Autorizado ServiceNow pelo SENAI-SP</p>
      </div>
      <div class="fas fa-long-arrow-alt-right arrow"></div>
      <div class="node highlight">
        <i class="fas fa-cogs"></i>
        <h3>Especialização</h3>
        <p>Gestão de Serviços de TI (ITSM) e Automação de Workflows</p>
      </div>
      <div class="fas fa-long-arrow-alt-right arrow"></div>
      <div class="node">
        <i class="fas fa-briefcase"></i>
        <h3>Mercado</h3>
        <p>Entrega de profissionais prontos para demandas de TI corporativa</p>
      </div>
    </div>
  </div>
</body>
</html>
