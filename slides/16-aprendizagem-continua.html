<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0B132B; color: #F8FAFC; font-family: 'Inter', sans-serif; overflow: hidden; }
    .slide-container {
      width: 1280px; min-height: 720px; background: #0B132B;
      display: flex; flex-direction: column; padding: 60px; align-items: center; justify-content: center;
    }
    .cycle { display: flex; align-items: center; gap: 40px; margin-bottom: 60px; }
    .cycle-node {
      width: 250px; height: 120px; background: #1C2541; border: 2px solid #334155;
      border-radius: 60px; display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 700; color: #00E5FF;
    }
    .arrow { font-size: 32px; color: #3B82F6; }
    .quote { font-size: 36px; font-weight: 400; text-align: center; max-width: 900px; line-height: 1.4; color: #F8FAFC; }
    .quote span { font-weight: 700; color: #00E5FF; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="cycle">
      <div class="cycle-node">Aprender</div>
      <i class="fas fa-sync arrow"></i>
      <div class="cycle-node">Desaprender</div>
      <i class="fas fa-sync arrow"></i>
      <div class="cycle-node">Reaprender</div>
    </div>
    <div class="quote">
      Aprender continuamente é atualizar conhecimentos, rever práticas e aplicar o que se aprende em novos contextos.
    </div>
  </div>
</body>
</html>
