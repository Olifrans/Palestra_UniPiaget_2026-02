<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0B132B; color: #F8FAFC; font-family: 'Inter', sans-serif; overflow: hidden; }
    .slide-container {
      width: 1280px; min-height: 720px; background: #0B132B;
      display: flex; flex-direction: column; padding: 60px; position: relative;
    }
    .decoration { position: absolute; bottom: 0; left: 0; width: 500px; height: 400px; background: radial-gradient(circle at 30% 70%, #00E5FF11 0%, transparent 70%); }
    .content { flex: 1; display: flex; flex-direction: column; justify-content: center; z-index: 1; }
    h1 { font-size: 56px; font-weight: 700; margin-bottom: 40px; color: #00E5FF; }
    .quote { font-size: 24px; font-style: italic; color: #94A3B8; max-width: 800px; line-height: 1.6; margin-bottom: 60px; border-left: 4px solid #3B82F6; padding-left: 30px; }
    .contact { display: flex; gap: 40px; font-size: 20px; }
    .contact-item { display: flex; align-items: center; gap: 12px; color: #F8FAFC; text-decoration: none; }
    .contact-item i { color: #00E5FF; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="decoration"></div>
    <div class="content">
      <h1>Obrigado. Vamos conversar?</h1>
      <div class="quote">
        “O diploma representa uma conquista. O conhecimento abre possibilidades. Mas é a capacidade de transformar conhecimento em soluções que constrói uma trajetória profissional.”
        <br><br>— Francisco Oliveira
      </div>
      <div class="contact">
        <span class="contact-item"><i class="fas fa-comments"></i> Perguntas e conversa</span>
      </div>
    </div>
  </div>
</body>
</html>
