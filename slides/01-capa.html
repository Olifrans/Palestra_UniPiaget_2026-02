<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0B132B; color: #F8FAFC; font-family: 'Inter', sans-serif; overflow: hidden; }
    .slide-container {
      width: 1280px; min-height: 720px; background: url('../assets/01-cover-students.jpg') no-repeat center center;
      background-size: cover; display: flex; flex-direction: column; padding: 60px; position: relative;
    }
    .overlay { position: absolute; inset: 0; background: linear-gradient(90deg, #0B132BEE 25%, #0B132B66 100%); }
    .main-content { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .title-group { border-left: 6px solid #00E5FF; padding-left: 40px; }
    h1 { font-size: 64px; font-weight: 700; line-height: 1.1; margin-bottom: 24px; max-width: 750px; }
    .subtitle { font-size: 28px; color: #94A3B8; max-width: 650px; line-height: 1.4; margin-bottom: 60px; }
    .author-info { font-size: 20px; color: #00E5FF; display: flex; flex-direction: column; gap: 8px; }
    .author-info .name { font-weight: 700; color: #F8FAFC; font-size: 26px; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="overlay"></div>
    <div class="main-content">
      <div class="title-group">
        <h1>Da formação à transformação profissional</h1>
        <p class="subtitle">Minha trajetória, a transformação tecnológica e os desafios da empregabilidade no século XXI</p>
      </div>
      <div class="author-info">
        <span class="name">Francisco Oliveira</span>
        <span>Atuação Profissional & Docência</span>
      </div>
    </div>
  </div>
</body>
</html>
