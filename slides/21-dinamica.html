<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0B132B; color: #F8FAFC; font-family: 'Inter', sans-serif; overflow: hidden; }
    .slide-container {
      width: 1280px; min-height: 720px; background: #0B132B;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px;
    }
    header { margin-bottom: 60px; text-align: center; }
    h2 { font-size: 28px; color: #94A3B8; text-transform: uppercase; letter-spacing: 2px; }
    .question-box { background: #1C2541; padding: 60px; border-radius: 20px; border: 2px solid #00E5FF; box-shadow: 0 0 30px #00E5FF22; max-width: 1000px; }
    .question { font-size: 40px; font-weight: 700; text-align: center; line-height: 1.3; }
    .sub-question { margin-top: 40px; font-size: 20px; color: #94A3B8; text-align: center; }
  </style>
</head>
<body>
  <div class="slide-container">
    <header>
      <h2>Dinâmica: Você está preparado?</h2>
    </header>
    <div class="question-box">
      <div class="question">"Se você precisasse demonstrar hoje suas habilidades, quais projetos ou conhecimentos apresentaria?"</div>
      <div class="sub-question">A competência não é o que você diz que sabe, é o que você consegue provar que faz.</div>
    </div>
  </div>
</body>
</html>
